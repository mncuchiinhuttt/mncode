<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E111A"/>
      <stop offset="100%" stop-color="#07080C"/>
    </linearGradient>
    <linearGradient id="accentPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1E2438" stroke-width="12"/>

  <!-- Terminal Prompt Accent Symbol -->
  <g transform="translate(0, -25)">
    <!-- Prompt Chevron -->
    <path d="M120 180 L180 230 L120 280" fill="none" stroke="url(#accentPink)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cursor Dash -->
    <rect x="200" y="270" width="40" height="12" rx="6" fill="#F472B6"/>

    <!-- Main Typography: mncode -->
    <text x="256" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="82" fill="#FFFFFF" letter-spacing="-3" text-anchor="middle">
      mncode
    </text>

    <!-- Subtitle: by mncuchiinhuttt -->
    <text x="256" y="340" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace" font-weight="600" font-size="21" fill="#94A3B8" letter-spacing="4" text-anchor="middle">
      by mncuchiinhuttt
    </text>
  </g>
</svg>
